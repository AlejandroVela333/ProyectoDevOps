name: CI/CD - Build, Push and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - adservice
          - checkoutservice
          - currencyservice
          - emailservice
          - loadgenerator
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice
          - shoppingassistantservice
        include:
          - service: cartservice
            context: ./src/cartservice/src

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Pedir credenciales de Docker Hub a Vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secret/data/online-boutique/dockerhub username | DOCKERHUB_USERNAME ;
            secret/data/online-boutique/dockerhub token | DOCKERHUB_TOKEN

      - name: Login a Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build y push de ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || format('./src/{0}', matrix.service) }}
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Pedir usuario de Docker Hub a Vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secret/data/online-boutique/dockerhub username | DOCKERHUB_USERNAME

      - name: Deploy con Helm
        run: helm upgrade --install online-boutique ./helm-chart --set images.repository=${{ env.DOCKERHUB_USERNAME }} --set images.tag=latest
