name: CI/CD - Build, Push and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - adservice
          - checkoutservice
          - currencyservice
          - emailservice
          - loadgenerator
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice
          - shoppingassistantservice
        include:
          - service: cartservice
            context: ./src/cartservice/src
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push de ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || format('./src/{0}', matrix.service) }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Deploy con Helm
        run: |
          helm upgrade --install online-boutique ./helm-chart `
            --set images.repository=${{ secrets.DOCKERHUB_USERNAME }} `
            --set images.tag=latest
